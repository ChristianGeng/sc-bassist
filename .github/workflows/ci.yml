name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck run.sh scripts/*.sh
      - name: whitespace errors
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # 22.04 ships SuperCollider 3.11, 24.04 ships 3.13
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SB_NO_PWJACK: "1"
      SB_COVERAGE_KEEP: "1"
      SB_TEST_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v5
      - name: Install SuperCollider, JACK and ffmpeg
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            supercollider-language supercollider-server jackd2 ffmpeg
          dpkg -s supercollider-language | grep '^Version'
      - name: Start a dummy JACK server
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 1024 > jackd.log 2>&1 &
          sleep 3
          pgrep -x jackd || { cat jackd.log; exit 1; }
      - name: compile
        run: scripts/test.sh compile
      - name: unit
        run: scripts/test.sh unit
      - name: ui
        run: scripts/test.sh ui
      - name: integration
        run: scripts/test.sh integration
      - name: Upload logs and UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            out/
            jackd.log
          if-no-files-found: ignore
